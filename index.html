<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schiffeleers Glas · Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=JetBrains+Mono:wght@400;500&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f1ea;
  --bg-elev: #ffffff;
  --ink: #1a1a1a;
  --ink-soft: #5b5b5b;
  --ink-faint: #9a9a9a;
  --line: #e2dcd0;
  --line-strong: #1a1a1a;
  --accent: #c7411e;
  --accent-soft: #f5e3dc;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter Tight', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
  background-image: radial-gradient(circle at 1px 1px, rgba(0,0,0,0.04) 1px, transparent 0);
  background-size: 24px 24px;
}

.shell {
  max-width: 1280px;
  margin: 0 auto;
  padding: 56px 32px 80px;
}

header.masthead {
  border-bottom: 2px solid var(--line-strong);
  padding-bottom: 28px;
  margin-bottom: 48px;
  display: flex;
  align-items: center;
  gap: 28px;
  flex-wrap: wrap;
}

.logo {
  width: 72px;
  height: 66px;
  flex-shrink: 0;
}
.logo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.brand h1 {
  font-family: 'Fraunces', serif;
  font-weight: 800;
  font-size: clamp(36px, 5vw, 58px);
  line-height: 0.95;
  letter-spacing: -0.02em;
}
.brand h1 em {
  color: var(--accent);
  font-style: italic;
  font-weight: 400;
}
.brand p {
  margin-top: 10px;
  color: var(--ink-soft);
  font-size: 14px;
  letter-spacing: 0.02em;
  max-width: 60ch;
}

.section-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--line);
}
.section-label .count {
  background: var(--ink);
  color: var(--bg);
  padding: 1px 8px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 500;
}

.tools-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 24px;
}

.tile {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  padding: 28px 26px;
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
  gap: 14px;
  position: relative;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 3px 3px 0 var(--line-strong);
  cursor: pointer;
  min-height: 210px;
}
.tile:hover {
  transform: translate(-2px, -2px);
  box-shadow: 5px 5px 0 var(--line-strong);
}
.tile:active {
  transform: translate(0, 0);
  box-shadow: 3px 3px 0 var(--line-strong);
}
.tile.disabled {
  cursor: not-allowed;
  opacity: 0.55;
  background: transparent;
  border-style: dashed;
  box-shadow: none;
}
.tile.disabled:hover {
  transform: none;
  box-shadow: none;
}

.tile-glyph {
  font-family: 'Fraunces', serif;
  font-size: 44px;
  line-height: 1;
  color: var(--accent);
  font-style: italic;
  font-weight: 400;
  align-self: flex-start;
}
.tile.disabled .tile-glyph {
  color: var(--ink-faint);
}

.tile-title {
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 22px;
  letter-spacing: -0.01em;
  line-height: 1.1;
}
.tile-desc {
  color: var(--ink-soft);
  font-size: 13.5px;
  flex: 1;
}
.tile-meta {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink-faint);
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: auto;
}
.tile-meta::before {
  content: '';
  display: inline-block;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accent);
}
.tile.disabled .tile-meta::before {
  background: var(--ink-faint);
}

.tile-arrow {
  position: absolute;
  top: 22px;
  right: 22px;
  font-family: 'Fraunces', serif;
  font-size: 22px;
  color: var(--ink-faint);
  font-style: italic;
  transition: transform 0.15s, color 0.15s;
}
.tile:hover .tile-arrow {
  color: var(--accent);
  transform: translateX(4px);
}
.tile.disabled .tile-arrow {
  display: none;
}

footer {
  margin-top: 80px;
  padding-top: 24px;
  border-top: 1px solid var(--line);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink-faint);
  text-align: center;
}

@media (max-width: 720px) {
  .shell { padding: 32px 18px 60px; }
  .tools-grid { grid-template-columns: 1fr; }
  header.masthead { gap: 18px; }
  .logo { width: 56px; height: 51px; }
}
</style>
</head>

const grid = document.getElementById('toolsGrid');
const availableCount = tools.filter(t => t.status === 'available').length;
document.getElementById('toolCount').textContent = availableCount;

for (const t of tools) {
  const isAvailable = t.status === 'available';
  const tag = isAvailable ? 'a' : 'div';
  const el = document.createElement(tag);
  el.className = 'tile' + (isAvailable ? '' : ' disabled');
  if (isAvailable) {
    el.href = t.file;
  }
  el.innerHTML =
    '<div class="tile-glyph">' + t.glyph + '</div>' +
    '<div class="tile-arrow">↗</div>' +
    '<div class="tile-title">' + t.title + '</div>' +
    '<div class="tile-desc">' + t.desc + '</div>' +
    '<div class="tile-meta">' + t.meta + '</div>';
  grid.appendChild(el);
}
