<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOM Studio — La Gravière</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=JetBrains+Mono:wght@300;400;500;600&family=Inter+Tight:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
</script>
<style>
  :root {
    --bg: #0f0e0c;
    --bg-2: #161410;
    --panel: #1c1a16;
    --panel-2: #24211c;
    --line: #2e2a23;
    --ink: #ece4d3;
    --ink-2: #9c9385;
    --ink-3: #6a6253;
    --accent: #d4ae5e;
    --accent-2: #e8c478;
    --red: #c5453a;
    --green: #6b8e4e;
    --blue: #5a7d99;
    --shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 8px 24px -8px rgba(0,0,0,0.5);
    --grid-line: rgba(255,255,255,0.04);
  }

  /* Light theme — paper/cream professional palette */
  body.theme-light {
    --bg: #f7f4ec;
    --bg-2: #efeadc;
    --panel: #ffffff;
    --panel-2: #faf6ea;
    --line: #d9d1bd;
    --ink: #2a261e;
    --ink-2: #5e574a;
    --ink-3: #918874;
    --accent: #a37820;
    --accent-2: #b88a2c;
    --red: #b13a30;
    --green: #5a7d3f;
    --blue: #426b86;
    --shadow: 0 1px 0 rgba(0,0,0,0.02) inset, 0 8px 20px -10px rgba(60,50,30,0.18);
    --grid-line: rgba(0,0,0,0.04);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter Tight', sans-serif;
    font-size: 14px;
    line-height: 1.4;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .app { display: grid; grid-template-columns: 240px 1fr; height: 100vh; }

  /* Sidebar */
  .sidebar {
    background: var(--bg-2);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .brand {
    padding: 22px 22px 18px;
    border-bottom: 1px solid var(--line);
  }
  .brand-mark {
    display: flex; align-items: baseline; gap: 8px;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 22px;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .brand-mark .dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; display: inline-block; }
  .brand-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-3);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 4px;
  }
  .nav {
    flex: 1;
    padding: 16px 12px;
    overflow-y: auto;
  }
  .nav-section {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-3);
    padding: 14px 10px 8px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px;
    border-radius: 6px;
    cursor: pointer;
    color: var(--ink-2);
    font-size: 13.5px;
    font-weight: 500;
    transition: all 0.15s ease;
    user-select: none;
  }
  .nav-item:hover { background: var(--panel); color: var(--ink); }
  .nav-item.active {
    background: var(--panel-2);
    color: var(--ink);
    box-shadow: var(--shadow);
  }
  .nav-item.active .nav-icon { color: var(--accent); }
  .nav-icon {
    width: 16px; height: 16px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--ink-3);
  }
  .nav-count {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-3);
    background: var(--panel);
    padding: 2px 6px;
    border-radius: 4px;
  }
  .nav-item.active .nav-count { background: var(--bg); color: var(--accent); }

  .sidebar-foot {
    padding: 14px;
    border-top: 1px solid var(--line);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-3);
    line-height: 1.6;
  }
  .sidebar-foot .meta-row { display: flex; justify-content: space-between; }

  /* Main */
  .main {
    display: flex; flex-direction: column;
    overflow: hidden;
    background: var(--bg);
  }
  .topbar {
    height: 56px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center;
    padding: 0 24px;
    gap: 16px;
    background: var(--bg-2);
  }
  .topbar-title {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .topbar-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding-left: 12px;
    margin-left: 12px;
    border-left: 1px solid var(--line);
  }
  .topbar-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }

  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 14px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .btn:hover { background: var(--panel-2); border-color: var(--ink-3); }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #1a160d;
    font-weight: 600;
  }
  .btn-primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
  .btn-ghost { background: transparent; border-color: transparent; }
  .btn-ghost:hover { background: var(--panel); border-color: var(--line); }
  .btn-danger { color: var(--red); }
  .btn-danger:hover { background: rgba(197, 69, 58, 0.1); border-color: var(--red); }
  .btn svg { width: 14px; height: 14px; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }

  .search-box {
    position: relative;
    flex: 0 1 320px;
  }
  .search-box input {
    width: 100%;
    padding: 7px 12px 7px 32px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    font-family: inherit;
    font-size: 13px;
    outline: none;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--ink-3); }

  .content {
    flex: 1;
    overflow: auto;
    padding: 24px;
  }

  /* Dashboard */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px;
    position: relative;
    overflow: hidden;
  }
  .stat-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at top right, rgba(212, 174, 94, 0.05), transparent 60%);
    pointer-events: none;
  }
  .stat-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 8px;
  }
  .stat-value {
    font-family: 'Fraunces', serif;
    font-size: 32px;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .stat-unit {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-3);
    margin-left: 4px;
  }
  .stat-trend {
    font-size: 11px;
    color: var(--ink-2);
    margin-top: 6px;
  }

  /* Cards Grid */
  .section-header {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 14px;
  }
  .section-title {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .section-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .windows-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }
  .window-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.18s ease;
    position: relative;
  }
  .window-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 12px 32px -10px rgba(0,0,0,0.5);
  }
  .window-card-preview {
    background: var(--bg);
    aspect-ratio: 1.1 / 1;
    display: flex; align-items: center; justify-content: center;
    border-bottom: 1px solid var(--line);
    padding: 16px;
    position: relative;
  }
  .window-card-preview svg { max-width: 100%; max-height: 100%; color: var(--ink-2); }
  .window-card-body { padding: 14px 16px; }
  .window-card-id {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.05em;
  }
  .window-card-title {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 500;
    margin-top: 4px;
    margin-bottom: 8px;
  }
  .window-card-meta {
    display: flex; gap: 12px; flex-wrap: wrap;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-3);
  }
  .window-card-meta span strong { color: var(--ink-2); font-weight: 500; }
  .window-card-tag {
    position: absolute; top: 10px; right: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    background: var(--panel-2);
    backdrop-filter: blur(8px);
    border: 1px solid var(--line);
    padding: 3px 7px;
    border-radius: 4px;
    color: var(--ink-2);
    letter-spacing: 0.05em;
  }

  /* Detail view */
  .detail-grid {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 20px;
  }
  .detail-pane {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .detail-pane-head {
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
    background: var(--panel-2);
  }
  .detail-pane-head h3 {
    font-family: 'Fraunces', serif;
    font-size: 14px;
    font-weight: 500;
  }
  .detail-pane-body { padding: 18px; }
  .detail-svg-wrap {
    background: var(--bg);
    border-radius: 8px;
    padding: 20px;
    display: flex; align-items: center; justify-content: center;
    min-height: 320px;
  }
  .detail-svg-wrap svg { max-width: 100%; max-height: 480px; color: var(--ink-2); }

  .spec-list { display: grid; gap: 1px; background: var(--line); border-radius: 6px; overflow: hidden; }
  .spec-row {
    display: grid; grid-template-columns: 1fr auto;
    background: var(--panel);
    padding: 9px 12px;
    font-size: 12.5px;
  }
  .spec-row .lbl { color: var(--ink-3); font-family: 'JetBrains Mono', monospace; font-size: 11px; }
  .spec-row .val { color: var(--ink); font-weight: 500; }

  /* Tables */
  .table-wrap { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
  table { width: 100%; border-collapse: collapse; }
  thead { background: var(--panel-2); }
  th, td {
    text-align: left;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    font-size: 12.5px;
  }
  th {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 500;
  }
  td { color: var(--ink); }
  td.mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; }
  td.num { text-align: right; font-family: 'JetBrains Mono', monospace; }
  tr:hover td { background: var(--panel-2); }
  tr:last-child td { border-bottom: none; }
  .tag {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--bg-2);
    color: var(--ink-2);
    border: 1px solid var(--line);
  }
  .tag-accent { background: rgba(212, 174, 94, 0.1); color: var(--accent); border-color: rgba(212, 174, 94, 0.3); }
  .tag-blue { background: rgba(90, 125, 153, 0.1); color: var(--blue); border-color: rgba(90, 125, 153, 0.3); }
  .tag-green { background: rgba(107, 142, 78, 0.15); color: var(--green); border-color: rgba(107, 142, 78, 0.3); }
  .tag-warn { background: rgba(197, 69, 58, 0.12); color: var(--red); border-color: rgba(197, 69, 58, 0.35); }
  body.theme-light .tag-warn { background: rgba(177, 58, 48, 0.10); color: #8a2f27; border-color: rgba(177, 58, 48, 0.30); }

  /* Components table — editable cells */
  .components-table { font-size: 12.5px; }
  .components-table th { font-size: 9px; padding: 8px 8px; vertical-align: bottom; }
  .components-table td { padding: 6px 8px; vertical-align: middle; }
  .components-table .alt-cell { padding: 3px 4px; background: rgba(212, 174, 94, 0.02); }
  .components-table .inv-cell { padding: 3px 4px; background: rgba(90, 125, 153, 0.03); }
  .components-table tr.has-alt .alt-cell { background: rgba(212, 174, 94, 0.07); }
  .components-table tr.is-special td:nth-child(2) {
    border-left: 3px solid var(--red);
    padding-left: 6px;
  }
  .components-table tr.is-special { background: rgba(197, 69, 58, 0.025); }
  .components-table tr.is-short { background: rgba(197, 69, 58, 0.04); }
  .components-table tr.is-short.is-special { background: rgba(197, 69, 58, 0.06); }

  .alt-input, .inv-input {
    width: 100%;
    padding: 5px 7px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 4px;
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    outline: none;
    transition: all 0.12s ease;
  }
  .alt-input:hover, .inv-input:hover { background: var(--bg); border-color: var(--line); }
  .alt-input:focus, .inv-input:focus { background: var(--bg); border-color: var(--accent); }
  .alt-input::placeholder, .inv-input::placeholder { color: var(--ink-3); opacity: 0.5; font-style: italic; }
  .inv-input { text-align: right; font-weight: 500; }
  .inv-input.inv-toorder { color: var(--accent); font-weight: 600; }
  /* Remove number input spinners */
  .inv-input::-webkit-outer-spin-button,
  .inv-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .inv-input[type="number"] { -moz-appearance: textfield; }

  tr.saved-flash td { background: rgba(107, 142, 78, 0.12) !important; transition: background 0.6s ease; }

  /* ========================================================================
     PURCHASE ORDERS — application UI (in-app cards, form fields, template)
     ======================================================================== */
  .po-template-section {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .po-template-section summary {
    list-style: none;
    cursor: pointer;
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    user-select: none;
  }
  .po-template-section summary::-webkit-details-marker { display: none; }
  .po-template-section summary::before {
    content: '▸';
    color: var(--ink-3);
    margin-right: 10px;
    transition: transform 0.2s;
  }
  .po-template-section[open] summary::before { transform: rotate(90deg); }
  .po-summary-title { font-weight: 500; font-size: 14px; }
  .po-template-body {
    padding: 16px 18px 18px;
    border-top: 1px solid var(--line);
  }
  .po-tpl-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 18px;
  }
  .po-field { display: flex; flex-direction: column; gap: 5px; }
  .po-field-wide { grid-column: 1 / -1; }
  .po-field label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .po-field .req { color: var(--red); }
  .po-tpl-input, .po-meta-input {
    padding: 8px 10px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    font-size: 12.5px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.12s;
    width: 100%;
    box-sizing: border-box;
  }
  .po-tpl-input:focus, .po-meta-input:focus { border-color: var(--accent); }
  textarea.po-tpl-input, textarea.po-meta-input { resize: vertical; min-height: 60px; font-family: inherit; }

  .po-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .po-card-warn { border-color: rgba(197, 69, 58, 0.4); background: rgba(197, 69, 58, 0.02); }
  .po-card-head {
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
    gap: 10px;
  }
  .po-card-title { font-weight: 500; font-size: 15px; }
  .po-card-meta { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; font-family: 'JetBrains Mono', monospace; }
  .po-card-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .po-card-fields {
    padding: 14px 18px;
    background: var(--panel-2);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 16px;
    border-bottom: 1px solid var(--line);
  }
  .po-card-items { padding: 0; }
  .po-mini-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  .po-mini-table th {
    text-align: left;
    padding: 8px 14px;
    color: var(--ink-3);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    font-weight: 500;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .po-mini-table th.num { text-align: right; }
  .po-mini-table td { padding: 6px 14px; border-bottom: 1px solid var(--line); }
  .po-mini-table tr:last-child td { border-bottom: none; }
  .po-mini-table td.num { text-align: right; }

  /* ========================================================================
     PURCHASE ORDERS — printable layout (visible on screen during preview,
     and exclusive content for print)
     ======================================================================== */
  #po-print-host { display: none; }
  body.po-printing #po-print-host { display: block; }
  #po-print-host.po-preview-mode {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 9999;
    overflow: auto;
    padding: 40px 20px;
    backdrop-filter: blur(4px);
  }
  .po-preview-close, .po-preview-print {
    position: fixed;
    top: 16px;
    z-index: 10000;
  }
  .po-preview-close { right: 16px; }
  .po-preview-print { right: 150px; }

  .po-page {
    background: white;
    color: #111;
    width: 210mm;
    min-height: 297mm;
    padding: 18mm 18mm 16mm;
    margin: 0 auto;
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 11px;
    line-height: 1.4;
    box-sizing: border-box;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }
  .po-page .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 10px; }

  .po-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding-bottom: 14px;
    border-bottom: 2px solid #111;
    margin-bottom: 14px;
  }
  .po-from { max-width: 60%; }
  .po-from-name {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 18px;
    font-weight: 500;
    margin-bottom: 4px;
    color: #111;
  }
  .po-from-addr { white-space: pre-line; font-size: 10.5px; color: #333; }
  .po-from-meta { font-size: 9.5px; color: #555; margin-top: 2px; }

  .po-title-block { text-align: right; }
  .po-title {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
    color: #111;
  }

  .status-special { background: rgba(90, 125, 153, 0.15); color: var(--blue); }

  .special-checkbox {
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
    position: relative;
  }
  .special-checkbox input { position: absolute; opacity: 0; pointer-events: none; }
  .special-checkbox span {
    display: inline-block;
    width: 18px; height: 18px;
    border: 1.5px solid var(--line);
    border-radius: 4px;
    background: var(--bg);
    transition: all 0.15s ease;
    position: relative;
  }
  .special-checkbox:hover span { border-color: var(--red); }
  .special-checkbox input:checked + span {
    background: var(--red);
    border-color: var(--red);
  }
  .special-checkbox input:checked + span::after {
    content: '⚑';
    position: absolute;
    inset: 0;
    color: white;
    font-size: 11px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
  }

  /* Filter chips with counts */
  .chip em {

  .chip-warn:hover { background: rgba(197, 69, 58, 0.08); }
  .chip-warn.active { background: var(--red); color: white; border-color: var(--red); }

  .dropzone {
    border: 2px dashed var(--line);

  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }

// Lookup helper used by aggregation views. Tries any stored sample
// description first (most accurate), then falls back to artNr-only.
function lookupArticle(artNr, sampleDesc) {
  return getArticleInfo(artNr, sampleDesc || '');
}

function getArticleInfo(artNr, description) {
  // 1) Explicit catalog hit — always wins
  if (ARTICLE_CATEGORIES[artNr]) return { ...ARTICLE_CATEGORIES[artNr], source: 'catalog' };

  // For combined article numbers like "247001/247009", try first piece
  if (typeof artNr === 'string' && artNr.includes('/')) {
    const first = artNr.split('/')[0].trim();
    if (ARTICLE_CATEGORIES[first]) return { ...ARTICLE_CATEGORIES[first], source: 'catalog' };
  }

  // 2) Description keywords — usually the strongest signal for unknown parts
  if (description) {
    for (const h of DESC_HINTS) {
      if (h.rx.test(description)) return { cat: h.cat, type: h.type, name: h.name, source: 'description' };
    }
  }

  // 3) Numeric prefix heuristic (Schüco family convention)
  if (typeof artNr === 'string' && /^\d{6}/.test(artNr)) {
    const prefix = artNr.slice(0, 2);
    if (PREFIX_HINTS[prefix]) return { ...PREFIX_HINTS[prefix], source: 'prefix' };
  }

  // 4) Non-numeric article keys (Phonotherm, Dorpel165mm, TerraxBorstwering, …)
  if (typeof artNr === 'string' && !/^\d/.test(artNr)) {
    if (/phonotherm/i.test(artNr)) return { cat: 'profile',  type: 'profile',    name: 'Phonotherm isolatieprofiel', source: 'name' };
    if (/dorpel/i.test(artNr))     return { cat: 'profile',  type: 'profile',    name: 'Dorpel',                     source: 'name' };
    if (/terrax/i.test(artNr))     return { cat: 'profile',  type: 'profile',    name: 'Terrax borstwering',         source: 'name' };
    if (/eindstuk/i.test(artNr))   return { cat: 'profile',  type: 'accessory',  name: 'Eindstuk',                   source: 'name' };
  }

  // 5) Final fallback
  return { cat: 'other', name: 'Custom / Unclassified', type: 'other', source: 'fallback' };
}

/* ---------------- STORAGE ----------------
   Persistence strategy (v3):
   - Elements are SHARDED — each one stored under its own localStorage key
     (bom_studio_el_<merknummer>) to avoid single-key size limits some browsers
     enforce on file:// URLs and to permit partial recovery if one entry is bad.
   - An index key (bom_studio_idx) holds the ordered list of merknummers.
   - Alternatives and inventory remain compact single-key objects.
   - On save errors (quota, corruption) we toast and surface the problem visibly. */
const STORAGE_PREFIX  = 'bom_studio_el_';
const STORAGE_KEY_IDX = 'bom_studio_idx';
const STORAGE_KEY_ALTS = 'bom_studio_alternatives_v2';
const STORAGE_KEY_INV  = 'bom_studio_inventory_v2';
const STORAGE_KEY_PO_TPL  = 'bom_studio_po_template_v1';
const STORAGE_KEY_PO_META = 'bom_studio_po_meta_v1';

function setStorageStatus(label, detail) {
  const elStatus = document.getElementById('storage-status');
  if (elStatus) elStatus.textContent = label;
  const elDetail = document.getElementById('storage-detail');
  if (elDetail && detail !== undefined) elDetail.textContent = detail;
}

function bytesOf(s) {
  return new Blob([s]).size;
}

function fmtBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
  return (b / (1024 * 1024)).toFixed(2) + ' MB';
}

function totalLocalBytes() {
  let bytes = 0;
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && (k.startsWith(STORAGE_PREFIX) || k === STORAGE_KEY_IDX || k === STORAGE_KEY_ALTS || k === STORAGE_KEY_INV || k === STORAGE_KEY_PO_TPL || k === STORAGE_KEY_PO_META)) {
        const v = localStorage.getItem(k);
        bytes += k.length + (v ? v.length : 0);
      }
    }
  } catch (e) {}
  return bytes * 2; // UTF-16 stored size
}

async function saveState() {
  let savedLocal = true, errMsg = '';

  try {
    // Build index list
    const ids = STATE.elements.map(el => el.merknummer || el.id);
    localStorage.setItem(STORAGE_KEY_IDX, JSON.stringify(ids));

    // Remove keys for elements that no longer exist
    const existing = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(STORAGE_PREFIX)) existing.push(k);
    }
    const wantKeys = new Set(STATE.elements.map(el => STORAGE_PREFIX + (el.merknummer || el.id)));
    for (const k of existing) {
      if (!wantKeys.has(k)) localStorage.removeItem(k);
    }

    // Write each element under its own key
    for (const el of STATE.elements) {
      const key = STORAGE_PREFIX + (el.merknummer || el.id);
      localStorage.setItem(key, JSON.stringify(el));
    }

    // Companion catalogs
    localStorage.setItem(STORAGE_KEY_ALTS, JSON.stringify(STATE.alternatives));
    localStorage.setItem(STORAGE_KEY_INV,  JSON.stringify(STATE.inventory));
    if (STATE.poTemplate) localStorage.setItem(STORAGE_KEY_PO_TPL, JSON.stringify(STATE.poTemplate));
    localStorage.setItem(STORAGE_KEY_PO_META, JSON.stringify(STATE.poMeta));
  } catch (e) {
    savedLocal = false;
    errMsg = e && e.name === 'QuotaExceededError'
      ? 'browser storage full — export your data as JSON and remove some elements'
      : (e.message || 'save failed');
  }

  const elementsCount = STATE.elements.length;
  const totBytes = totalLocalBytes();
  const label = savedLocal ? 'SAVED' : 'ERROR';
  setStorageStatus(label, `${elementsCount} elements · ${fmtBytes(totBytes)}`);
  if (!savedLocal) {
    toast('Could not save: ' + errMsg, 'error');
  }
  return savedLocal;
}

async function loadState() {
  // Read sharded elements via index
  try {
    const idxRaw = localStorage.getItem(STORAGE_KEY_IDX);
    if (idxRaw) {
      const ids = JSON.parse(idxRaw);
      if (Array.isArray(ids) && ids.length) {
        const loaded = [];
        for (const id of ids) {
          const raw = localStorage.getItem(STORAGE_PREFIX + id);
          if (raw) {
            try { loaded.push(JSON.parse(raw)); }
            catch (e) { console.warn('Skip corrupt element', id, e); }
          }
        }
        if (loaded.length) STATE.elements = loaded;
      }
    } else {
      // Legacy v2 single-key load
      const legacy = localStorage.getItem('bom_studio_elements_v2');
      if (legacy) {
        const parsed = JSON.parse(legacy);
        if (Array.isArray(parsed) && parsed.length) {
          STATE.elements = parsed;
          // Migrate to sharded layout immediately
          await saveState();
          // Clean up old key
          try { localStorage.removeItem('bom_studio_elements_v2'); } catch (e) {}
        }
      }
    }
    const altRaw = localStorage.getItem(STORAGE_KEY_ALTS);
    if (altRaw) {
      const a = JSON.parse(altRaw);
      if (a && typeof a === 'object') STATE.alternatives = a;
    }
    const invRaw = localStorage.getItem(STORAGE_KEY_INV);
    if (invRaw) {
      const inv = JSON.parse(invRaw);
      if (inv && typeof inv === 'object') STATE.inventory = inv;
    }
    const tplRaw = localStorage.getItem(STORAGE_KEY_PO_TPL);
    if (tplRaw) {
      const tpl = JSON.parse(tplRaw);
      if (tpl && typeof tpl === 'object') STATE.poTemplate = { ...DEFAULT_PO_TEMPLATE, ...tpl };
    }
    const metaRaw = localStorage.getItem(STORAGE_KEY_PO_META);
    if (metaRaw) {
      const meta = JSON.parse(metaRaw);
      if (meta && typeof meta === 'object') STATE.poMeta = meta;
    }
  } catch (e) {
    console.warn('localStorage read failed', e);
  }

  const totBytes = totalLocalBytes();
  setStorageStatus(STATE.elements.length > 0 ? 'LOADED' : 'EMPTY',
                   `${STATE.elements.length} elements · ${fmtBytes(totBytes)}`);
}

/* ---------------- PDF PARSER ---------------- */
async function parsePDF(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let allText = '';
  const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    // Build text items with positions for better parsing
    const items = content.items.map(it => ({
      str: it.str,
      x: it.transform[4],
      y: it.transform[5],
    }));
    // Sort top-to-bottom, then left-to-right
    items.sort((a, b) => b.y - a.y || a.x - b.x);
    // Group by approximate y row
    const rows = [];
    let curRow = [];
    let curY = null;
    for (const it of items) {
      if (curY === null || Math.abs(it.y - curY) < 3) {
        curRow.push(it);
        curY = curY === null ? it.y : curY;
      } else {
        rows.push(curRow);
        curRow = [it];
        curY = it.y;
      }
    }
    if (curRow.length) rows.push(curRow);
    const pageLines = rows.map(r => r.map(i => i.str).join(' ').replace(/\s+/g, ' ').trim()).filter(Boolean);
    pages.push(pageLines);
    allText += pageLines.join('\n') + '\n';
  }
  return { text: allText, pages };
}

function parseStuklijst(text, filename) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);

  const el = {
    id: Math.random().toString(36).slice(2, 10),
    sourceFile: filename,
    importedAt: new Date().toISOString(),
    merknummer: '',
    project: '',
    projectDescription: '',
    profileSystem: '',
    qty: 1,
    totalWidth: 0,
    totalHeight: 0,
    elementWidth: 0,
    elementHeight: 0,
    finishIn: '',
    finishOut: '',
    weightProfiles: 0,
    weightAccessories: 0,
    weightGlass: 0,
    weightTotal: 0,
    uTotal: 0,
    uProfile: 0,
    uGlass: 0,
    gwp: 0,
    config: '',
    processTime: 0,
    mountTime: 0,
    parts: [],
    panes: 0,
    paneWidths: [],
  };

  // Helper: find value in line
  const findVal = (regex) => {
    for (const ln of lines) {
      const m = ln.match(regex);
      if (m) return m[1].trim();
    }
    return '';
  };
  const findNum = (regex) => {
    const v = findVal(regex);
    if (!v) return 0;
    return parseFloat(v.replace(/\./g, '').replace(',', '.')) || 0;
  };

  el.merknummer = findVal(/Merknummer:\s*([A-Z0-9.]+)/i) || filename.replace(/\.pdf$/i, '').replace(/_/g, '.');
  el.project = findVal(/Projectnummer:\s*(.+?)(?:Projectomschrijving|$)/i) || 'La Gravière Construct Blok G';
  el.projectDescription = findVal(/Projectomschrijving:\s*([^\n]+?)(?:Merknummer|Merkomschrijving|$)/i) || '47573 (AL2019-0404)';
  el.profileSystem = findVal(/Profielsysteem:\s*(.+?)(?:Stuks|$)/i) || 'Schüco AWS/ADS 70.HI';
  el.totalWidth = findNum(/Totale breedte:\s*([\d.,]+)\s*mm/i);
  el.totalHeight = findNum(/Totale hoogte:\s*([\d.,]+)\s*mm/i);
  el.elementWidth = findNum(/Elementbreedte:\s*([\d.,]+)/i);
  el.elementHeight = findNum(/Elementhoogte:\s*([\d.,]+)/i);
  el.finishIn = findVal(/Afwerking binnen:\s*(.+?)(?:Afwerking buiten|$)/i);
  el.finishOut = findVal(/Afwerking buiten:\s*(.+?)(?:Bewerkings|$)/i);

  // Weights - find pattern "Profielen: X,XXX kg"
  const wMatches = [...text.matchAll(/Profielen:\s+([\d.,]+)\s*kg/gi)];
  if (wMatches.length) el.weightProfiles = parseFloat(wMatches[0][1].replace(/\./g, '').replace(',', '.'));
  const wT = [...text.matchAll(/Toebehoren:\s+([\d.,]+)\s*kg/gi)];
  if (wT.length) el.weightAccessories = parseFloat(wT[0][1].replace(/\./g, '').replace(',', '.'));
  const wG = [...text.matchAll(/Glas:\s+([\d.,]+)\s*kg/gi)];
  if (wG.length) el.weightGlass = parseFloat(wG[0][1].replace(/\./g, '').replace(',', '.'));
  const wTot = [...text.matchAll(/Totaalsom:\s+([\d.,]+)\s*kg/gi)];
  if (wTot.length) el.weightTotal = parseFloat(wTot[0][1].replace(/\./g, '').replace(',', '.'));

  // U-values
  el.uTotal = findNum(/Totaal\s*\(Uw,BW\):\s*([\d.,]+)\s*W/i);
  el.uProfile = findNum(/Profielen\s*\(Uf\):\s*([\d.,]+)\s*W/i);
  el.uGlass = findNum(/Glas\s*\(Ug\):\s*([\d.,]+)\s*W/i);
  el.gwp = findNum(/Per stuk:\s*([\d.,]+)\s*\[kg/i);

  el.processTime = findNum(/Bewerkingstijd\/stuk:\s*([\d.,]+)\s*h/i);
  el.mountTime = findNum(/montagetijd\/stuk:\s*([\d.,]+)\s*h/i);

  // Configuration tags (Vast-DK, DK-Vast, Dubbel DK, etc.)
  const configMatches = [];
  const knownConfigs = ['Vast - DK', 'DK - Vast', 'Dubbel DK', 'Afwateringsrubber', 'Dorpel lengte', 'Doorvalbeveiliging'];
  for (const cfg of knownConfigs) {
    if (text.toLowerCase().includes(cfg.toLowerCase())) configMatches.push(cfg);
  }
  el.config = configMatches.join(' · ');

  // Parts - look for numbered rows with article numbers
  // Pattern: "<volgnr> <stuks> <art.nr> <description> [ve.nr] [maat] [zaagsnede]"
  const partRegex = /^(\d{1,3})\s+(\d+)\s+(\d{6}|\d+\s*\/\s*\d{6}|Phonotherm\s*\w*|Dorpel\s*\w*|Eindstuk\s*[\w\s]+|TerraxBorstw\w*)\s+(.+?)$/;

  for (let i = 0; i < lines.length; i++) {
    const ln = lines[i];
    // Try matching: rownum stuks artnr desc...
    const m = ln.match(/^(\d{1,3})\s+(\d+)\s+(\d{6})\s+(.+)$/);
    if (m) {
      const rest = m[4];
      // Try parse: desc... [ve.nr] [maat] [zaagsnede]
      // Look for trailing numbers like "1 2.475,0 90,0 / 90,0" or just "1"
      const trailing = rest.match(/^(.+?)\s+(\d+)\s+([\d.,]+)\s+([\d.,]+\s*\/\s*[\d.,]+)\s*$/);
      const trailingShort = rest.match(/^(.+?)\s+(\d+)\s*$/);
      let desc = rest, veNr = '', maat = '', cut = '';
      if (trailing) {
        desc = trailing[1].trim();
        veNr = trailing[2];
        maat = trailing[3];
        cut = trailing[4];
      } else if (trailingShort) {
        desc = trailingShort[1].trim();
        veNr = trailingShort[2];
      }
      const info = getArticleInfo(m[3], desc);
      el.parts.push({
        volgnr: parseInt(m[1]),
        stuks: parseInt(m[2]),
        artNr: m[3],
        description: desc,
        veNr,
        maat: parseFloat(maat.replace(/\./g, '').replace(',', '.')) || 0,
        cut,
        category: info.cat,
        type: info.type,
        catalogName: info.name,
        catalogSource: info.source,
      });
    } else {
      // Combined article numbers like "247001 / 247009"
      const m2 = ln.match(/^(\d{1,3})\s+(\d+)\s+(\d{6}\s*\/\s*\d{6})\s+(.+)$/);
      if (m2) {
        const artNr = m2[3].replace(/\s+/g, '');
        const info = getArticleInfo(artNr, m2[4].trim());
        el.parts.push({
          volgnr: parseInt(m2[1]),
          stuks: parseInt(m2[2]),
          artNr,
          description: m2[4].trim(),
          veNr: '',
          maat: 0,
          cut: '',
          category: info.cat,
          type: info.type,
          catalogName: info.name,
          catalogSource: info.source,
        });
      }
    }
  }

  // Glass plates - parse only to determine element layout (panel widths),
  // glass details themselves are NOT stored to save space.
  const glassIdx = lines.findIndex(l => l.startsWith('Glasplaten') || l === 'Glasplaten');
  const parsedGlass = [];
  if (glassIdx >= 0) {
    for (let i = glassIdx; i < lines.length; i++) {
      const gm = lines[i].match(/^(\d{1,3})\s+(\d+)\s+(1\.0\s+\d+#?\/\d+\s+WE\s+Argon\/\d+)\s+(\d+\/\d+\/\d+)\s+(\d+)\s+(\d+(?:\.\d+)?)\s+([\d.,]+)\s+x\s+([\d.,]+)/);
      if (gm) {
        parsedGlass.push({
          stuks: parseInt(gm[2]),
          width:  parseFloat(gm[7].replace(/\./g, '').replace(',', '.')),
          height: parseFloat(gm[8].replace(/\./g, '').replace(',', '.')),
        });
      }
    }
  }
  // Keep only the count and a coarse width array for the drawing logic
  el.panes = parsedGlass.length;
  el.paneWidths = parsedGlass.map(g => g.width);

  // Classify element type
  if (el.panes === 1) el.type = 'fixed';
  else if (el.config.toLowerCase().includes('dubbel')) el.type = 'double-dk';
  else if (el.config.toLowerCase().includes('dk')) el.type = 'fixed-dk';
  else el.type = 'window';

  return el;
}

/* ---------------- ELEMENT DRAWING (SVG) ---------------- */
function drawElement(el, opts = {}) {
  const padding = opts.padding || 30;
  const maxW = opts.maxW || 260;
  const maxH = opts.maxH || 260;
  const w = el.totalWidth || 1000;
  const h = el.totalHeight || 1000;
  const scale = Math.min((maxW - padding * 2) / w, (maxH - padding * 2) / h);
  const sw = w * scale;
  const sh = h * scale;
  const x0 = (maxW - sw) / 2;
  const y0 = (maxH - sh) / 2;

  // Determine layout from glass count + dimensions
  const layouts = analyzeLayout(el);

  let svg = `<svg viewBox="0 0 ${maxW} ${maxH}" xmlns="http://www.w3.org/2000/svg" style="font-family:'JetBrains Mono',monospace;font-size:8px">`;

  // Background
  svg += `<rect x="0" y="0" width="${maxW}" height="${maxH}" fill="transparent"/>`;

  // Outer frame (kozijn)
  const frameThickness = Math.max(4, sw * 0.04);
  svg += `<rect x="${x0}" y="${y0}" width="${sw}" height="${sh}" fill="none" stroke="#c5453a" stroke-width="${frameThickness}"/>`;

  // Inner panels based on layout
  for (const panel of layouts.panels) {
    const px = x0 + panel.x * sw;
    const py = y0 + panel.y * sh;
    const pw = panel.w * sw;
    const ph = panel.h * sh;

    // Sash frame if operable
    if (panel.operable) {
      const sashT = Math.max(3, sw * 0.025);
      svg += `<rect x="${px}" y="${py}" width="${pw}" height="${ph}" fill="rgba(197,69,58,0.15)" stroke="#c5453a" stroke-width="${sashT}"/>`;
      // Glass
      const gT = sashT + 2;
      svg += `<rect x="${px + gT}" y="${py + gT}" width="${pw - gT * 2}" height="${ph - gT * 2}" fill="rgba(140,170,200,0.10)" stroke="currentColor" stroke-opacity="0.18" stroke-width="0.5"/>`;
      // DK indicator triangles
      if (panel.opening === 'dk-right') {
        // tilt-turn right (hinge on right)
        svg += `<line x1="${px}" y1="${py + ph}" x2="${px + pw}" y2="${py}" stroke="currentColor" stroke-opacity="0.45" stroke-width="0.5" stroke-dasharray="2,2"/>`;
        svg += `<line x1="${px}" y1="${py + ph}" x2="${px + pw}" y2="${py + ph}" stroke="currentColor" stroke-opacity="0.45" stroke-width="0.5" stroke-dasharray="2,2"/>`;
        svg += `<line x1="${px + pw / 2}" y1="${py}" x2="${px + pw}" y2="${py + ph}" stroke="currentColor" stroke-opacity="0.65" stroke-width="0.5"/>`;
        svg += `<line x1="${px + pw / 2}" y1="${py}" x2="${px + pw}" y2="${py}" stroke="currentColor" stroke-opacity="0.65" stroke-width="0.5"/>`;
        // handle
        svg += `<circle cx="${px + 4}" cy="${py + ph / 2}" r="1.5" fill="#d4ae5e"/>`;
      } else if (panel.opening === 'dk-left') {
        svg += `<line x1="${px + pw}" y1="${py + ph}" x2="${px}" y2="${py}" stroke="currentColor" stroke-opacity="0.45" stroke-width="0.5" stroke-dasharray="2,2"/>`;
        svg += `<line x1="${px + pw}" y1="${py + ph}" x2="${px}" y2="${py + ph}" stroke="currentColor" stroke-opacity="0.45" stroke-width="0.5" stroke-dasharray="2,2"/>`;
        svg += `<line x1="${px + pw / 2}" y1="${py}" x2="${px}" y2="${py + ph}" stroke="currentColor" stroke-opacity="0.65" stroke-width="0.5"/>`;
        svg += `<line x1="${px + pw / 2}" y1="${py}" x2="${px}" y2="${py}" stroke="currentColor" stroke-opacity="0.65" stroke-width="0.5"/>`;
        svg += `<circle cx="${px + pw - 4}" cy="${py + ph / 2}" r="1.5" fill="#d4ae5e"/>`;
      }
    } else {
      // Fixed glass
      svg += `<rect x="${px}" y="${py}" width="${pw}" height="${ph}" fill="rgba(140,170,200,0.08)" stroke="currentColor" stroke-opacity="0.15" stroke-width="0.5"/>`;
    }
  }

  // Mullion between panels
  for (const mull of layouts.mullions) {
    const mx = x0 + mull.x * sw;
    const my = y0 + mull.y * sh;
    const mw = mull.w * sw;
    const mh = mull.h * sh;
    svg += `<rect x="${mx}" y="${my}" width="${mw}" height="${mh}" fill="#c5453a"/>`;
  }

  // Dimension labels
  if (opts.dimensions) {
    svg += `<text x="${maxW / 2}" y="${y0 + sh + 16}" text-anchor="middle" fill="currentColor" fill-opacity="0.6" font-size="9">${Math.round(el.totalWidth)} mm</text>`;
    svg += `<text x="${x0 - 8}" y="${maxH / 2}" text-anchor="middle" fill="currentColor" fill-opacity="0.6" font-size="9" transform="rotate(-90 ${x0 - 8} ${maxH / 2})">${Math.round(el.totalHeight)} mm</text>`;
  }

  svg += '</svg>';
  return svg;
}

function analyzeLayout(el) {
  // Determine layout based on pane count + widths and config
  const panels = [];
  const mullions = [];
  // Back-compat: older parsed data may still have 'glass' array
  const panes = (typeof el.panes === 'number') ? el.panes : (el.glass ? el.glass.length : 0);
  const paneWidths = el.paneWidths || (el.glass ? el.glass.map(g => g.width) : []);

  if (panes === 0) {
    panels.push({ x: 0.05, y: 0.05, w: 0.9, h: 0.9, operable: false });
    return { panels, mullions };
  }

  if (panes === 1) {
    panels.push({ x: 0.05, y: 0.05, w: 0.9, h: 0.9, operable: el.parts.some(p => p.artNr === '382940') });
    return { panels, mullions };
  }

  // Two panels: figure out the split
  const totalW = el.totalWidth;

  // Sash is roughly 1000mm wide (959 sash + 50 mullion)
  const sashPanelW = 1000 / totalW;
  const fixedPanelW = 1 - sashPanelW - 0.005;

  // Determine if sash is left or right based on config
  // "Vast - DK" means fixed-left then DK-right
  // "DK - Vast" means DK-left then fixed-right
  const dkRight = el.config.includes('Vast - DK');
  const dkLeft = el.config.includes('DK - Vast');

  if (el.config.toLowerCase().includes('dubbel')) {
    // Two sashes (Dubbel DK)
    panels.push({ x: 0.04, y: 0.04, w: 0.46, h: 0.92, operable: true, opening: 'dk-right' });
    panels.push({ x: 0.50, y: 0.04, w: 0.46, h: 0.92, operable: true, opening: 'dk-left' });
  } else if (dkRight) {
    // Fixed left, DK right
    panels.push({ x: 0.04, y: 0.04, w: fixedPanelW - 0.04, h: 0.92, operable: false });
    panels.push({ x: fixedPanelW + 0.01, y: 0.04, w: sashPanelW - 0.05, h: 0.92, operable: true, opening: 'dk-right' });
    mullions.push({ x: fixedPanelW - 0.005, y: 0.04, w: 0.015, h: 0.92 });
  } else if (dkLeft) {
    // DK left, fixed right
    panels.push({ x: 0.04, y: 0.04, w: sashPanelW - 0.05, h: 0.92, operable: true, opening: 'dk-left' });
    panels.push({ x: sashPanelW + 0.01, y: 0.04, w: fixedPanelW - 0.05, h: 0.92, operable: false });
    mullions.push({ x: sashPanelW - 0.005, y: 0.04, w: 0.015, h: 0.92 });
  } else {
    // Default: equal split
    panels.push({ x: 0.04, y: 0.04, w: 0.46, h: 0.92, operable: false });
    panels.push({ x: 0.50, y: 0.04, w: 0.46, h: 0.92, operable: true, opening: 'dk-right' });
  }

  return { panels, mullions };
}

/* ---------------- VIEWS ---------------- */
function setView(view) {
  // Reset filter when switching to a different view family; filter semantics differ per view.
  if (STATE.currentView !== view) STATE.filter = 'all';
  STATE.currentView = view;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === view));
  const titles = {
    dashboard: ['Overview', 'DASHBOARD · 47573 / AL2019-0404'],
    elements: ['Elements', 'WINDOWS · DOORS · SLIDING'],
    components: ['Components', 'PARTS INVENTORY'],
    profiles: ['Profiles', 'EXTRUSIONS · LENGTHS'],
    glass: ['Glass', 'GLAZING SCHEDULE'],
    hardware: ['Hardware', 'BESLAG · FASTENERS'],
    import: ['Import', 'PDF · STUKLIJST'],
    export: ['Export', 'BOM · CSV · JSON'],
  };
  const [t, s] = titles[view] || ['', ''];
  document.getElementById('view-title').textContent = t;
  document.getElementById('view-sub').textContent = s;
  render();
}

function updateCounts() {
  document.getElementById('count-elements').textContent = STATE.elements.length;
  const allParts = STATE.elements.flatMap(e => e.parts);
  // Pick best category info per article, preferring the cached value from parse time.
  const articleCats = {};
  for (const p of allParts) {
    if (articleCats[p.artNr]) continue;
    if (p.category) articleCats[p.artNr] = p.category;
    else articleCats[p.artNr] = lookupArticle(p.artNr, p.description).cat;
  }
  const uniqueArticles = Object.keys(articleCats);
  document.getElementById('count-components').textContent = uniqueArticles.length;
  document.getElementById('count-profiles').textContent  = uniqueArticles.filter(a => articleCats[a] === 'profile').length;
  document.getElementById('count-hardware').textContent  = uniqueArticles.filter(a => articleCats[a] === 'hardware').length;
  // Purchase-order count: distinct suppliers among rows where toOrder > 0
  const poSuppliers = new Set();
  for (const art of uniqueArticles) {
    const inv = STATE.inventory[art];
    if (!inv || !Number(inv.toOrder)) continue;
    const alt = STATE.alternatives[art] || {};
    const supplier = (alt.supplier || '').trim() || '— unassigned —';
    poSuppliers.add(supplier);
  }
  const posEl = document.getElementById('count-pos');
  if (posEl) posEl.textContent = poSuppliers.size;
}

function render() {
  updateCounts();
  const el = document.getElementById('content');
  if (STATE.selectedElement) {
    el.innerHTML = renderDetailView(STATE.selectedElement);
    attachDetailHandlers();
    return;
  }
  switch (STATE.currentView) {
    case 'dashboard': el.innerHTML = renderDashboard(); break;
    case 'elements': el.innerHTML = renderElements(); attachElementHandlers(); break;
    case 'components': el.innerHTML = renderComponents(); attachComponentsHandlers(); break;
    case 'profiles': el.innerHTML = renderProfiles(); break;
    case 'hardware': el.innerHTML = renderHardware(); break;
    case 'import': el.innerHTML = renderImport(); attachImportHandlers(); break;
    case 'export': el.innerHTML = renderExport(); attachExportHandlers(); break;
    case 'purchase-orders': el.innerHTML = renderPurchaseOrders(); attachPOHandlers(); break;
  }
}

function attachDetailHandlers() {

function renderComponents() {
  // Aggregated list of all unique articles across all elements
  const agg = {};
  for (const el of STATE.elements) {
    for (const p of el.parts) {
      if (!agg[p.artNr]) {
        const info = (p.catalogName)
          ? { cat: p.category, type: p.type, name: p.catalogName, source: p.catalogSource || 'catalog' }
          : lookupArticle(p.artNr, p.description);
        agg[p.artNr] = {
          artNr: p.artNr,
          description: p.description,
          totalQty: 0,
          totalLength: 0,
          category: info.cat,
          type: info.type,
          usedIn: new Set(),
          info,
        };
      }
      agg[p.artNr].totalQty += p.stuks * el.qty;
      if (p.maat) agg[p.artNr].totalLength += p.maat * p.stuks * el.qty;
      agg[p.artNr].usedIn.add(el.merknummer);
    }
  }
  let rows = Object.values(agg);
  if (STATE.searchTerm) {
    const q = STATE.searchTerm.toLowerCase();
    rows = rows.filter(r => {
      const alt = STATE.alternatives[r.artNr] || {};
      const inv = STATE.inventory[r.artNr] || {};
      return r.artNr.toLowerCase().includes(q)
        || (r.description || '').toLowerCase().includes(q)
        || (r.info.name || '').toLowerCase().includes(q)
        || (alt.altPartNumber || '').toLowerCase().includes(q)
        || (alt.altName || '').toLowerCase().includes(q)
        || (alt.supplier || '').toLowerCase().includes(q)
        || (inv.productionNotes || '').toLowerCase().includes(q);
    });
  }

  // Helper: ordering status for a row
  const orderStatus = (r) => {
    const inv = STATE.inventory[r.artNr] || {};
    const stock = Number(inv.inStock || 0);
    const onOrder = Number(inv.onOrder || 0);
    const required = r.totalQty;
    const available = stock + onOrder;
    const shortfall = Math.max(0, required - available);
    const reorderAt = Number(inv.reorderAt || 0);
    let status = 'ok';
    if (inv.special) status = 'special';
    else if (shortfall > 0) status = 'short';
    else if (reorderAt > 0 && stock <= reorderAt) status = 'low';
    return { status, stock, onOrder, required, available, shortfall, inv };
  };

  // Filter chips
  if (STATE.filter === 'unclassified') {
    rows = rows.filter(r => r.info.source && r.info.source !== 'catalog');
  } else if (STATE.filter === 'with-alt') {
    rows = rows.filter(r => {
      const a = STATE.alternatives[r.artNr];
      return a && (a.altPartNumber || a.altName || a.supplier);
    });
  } else if (STATE.filter === 'without-alt') {
    rows = rows.filter(r => {
      const a = STATE.alternatives[r.artNr];
      return !a || !(a.altPartNumber || a.altName || a.supplier);
    });
  } else if (STATE.filter === 'special') {
    rows = rows.filter(r => (STATE.inventory[r.artNr] || {}).special);
  } else if (STATE.filter === 'to-order') {
    rows = rows.filter(r => Number((STATE.inventory[r.artNr] || {}).toOrder || 0) > 0);
  } else if (STATE.filter === 'short') {
    rows = rows.filter(r => orderStatus(r).status === 'short');
  } else if (STATE.filter === 'profile') {
    rows = rows.filter(r => r.category === 'profile');
  } else if (STATE.filter === 'hardware') {
    rows = rows.filter(r => r.category === 'hardware');
  } else if (STATE.filter === 'seal') {
    rows = rows.filter(r => r.category === 'seal');
  }

  // Sort: special first (need attention), then by shortfall, then by qty
  rows.sort((a, b) => {
    const sa = orderStatus(a), sb = orderStatus(b);
    if (sa.status === 'special' && sb.status !== 'special') return -1;
    if (sb.status === 'special' && sa.status !== 'special') return 1;
    if (sa.shortfall !== sb.shortfall) return sb.shortfall - sa.shortfall;
    return b.totalQty - a.totalQty;
  });

  const totalArticles = Object.keys(agg).length;
  const altCount = Object.values(agg).filter(r => {
    const a = STATE.alternatives[r.artNr];
    return a && (a.altPartNumber || a.altName || a.supplier);
  }).length;
  const unclassifiedCount = Object.values(agg).filter(r => r.info.source && r.info.source !== 'catalog').length;
  const specialCount = Object.values(agg).filter(r => (STATE.inventory[r.artNr] || {}).special).length;
  const toOrderCount = Object.values(agg).filter(r => Number((STATE.inventory[r.artNr] || {}).toOrder || 0) > 0).length;
  const shortCount = Object.values(agg).filter(r => orderStatus(r).status === 'short').length;

  // Source badge for classifier hint
  const sourceBadge = (src) => {
    if (!src || src === 'catalog') return '';
    const map = {
      description: { label: 'auto · desc',   cls: 'tag tag-blue',   title: 'Classified from part description' },
      prefix:      { label: 'auto · prefix', cls: 'tag',            title: 'Classified from article number prefix' },
      name:        { label: 'auto · name',   cls: 'tag tag-blue',   title: 'Classified from article key name' },
      fallback:    { label: 'unclassified',  cls: 'tag tag-warn',   title: 'Could not classify — please review' },
    };
    const m = map[src] || map.fallback;
    return `<span class="${m.cls}" title="${m.title}" style="margin-left:6px;font-size:9px">${m.label}</span>`;
  };

  // Status pill for a row
  const statusPill = (s) => {
    if (s.status === 'special') return `<span class="status-pill status-special" title="Special / custom — made separately">SPECIAL</span>`;
    if (s.status === 'short')   return `<span class="status-pill status-short" title="Short by ${s.shortfall} — order more">SHORT ${s.shortfall}</span>`;
    if (s.status === 'low')     return `<span class="status-pill status-low" title="Stock at or below reorder point">LOW</span>`;
    return `<span class="status-pill status-ok">OK</span>`;
  };

  return `
    <div class="filter-bar">
      <div class="chip ${STATE.filter === 'all' ? 'active' : ''}" onclick="setFilter('all')">All <em>${totalArticles}</em></div>
      <div class="chip ${STATE.filter === 'profile' ? 'active' : ''}" onclick="setFilter('profile')">Profiles</div>

function escapeAttr(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function updateAlternative(artNr, field, value) {
  if (!STATE.alternatives[artNr]) STATE.alternatives[artNr] = {};
  const trimmed = value.trim();
  if (trimmed) {
    STATE.alternatives[artNr][field] = trimmed;
  } else {
    delete STATE.alternatives[artNr][field];
    if (Object.keys(STATE.alternatives[artNr]).length === 0) {
      delete STATE.alternatives[artNr];
    }
  }
  saveState();
}

function updateInventory(artNr, field, value) {
  if (!STATE.inventory[artNr]) STATE.inventory[artNr] = {};
  if (field === 'special') {
    if (value) STATE.inventory[artNr].special = true;
    else delete STATE.inventory[artNr].special;
  } else {
    const n = value === '' ? null : Number(value);
    if (n !== null && !Number.isNaN(n) && n >= 0) {
      STATE.inventory[artNr][field] = n;
    } else {
      delete STATE.inventory[artNr][field];
    }
  }
  if (Object.keys(STATE.inventory[artNr]).length === 0) delete STATE.inventory[artNr];
  saveState();
}

function attachComponentsHandlers() {
  // Alternative text inputs
  document.querySelectorAll('.alt-input').forEach(inp => {
    inp.addEventListener('change', e => {
      updateAlternative(e.target.dataset.art, e.target.dataset.field, e.target.value);
      flashRow(e.target);
      updateRowClasses(e.target);
    });
    inp.addEventListener('click', e => e.stopPropagation());
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === 'Escape') e.target.blur(); });
  });
  // Inventory numeric inputs
  document.querySelectorAll('.inv-input').forEach(inp => {
    inp.addEventListener('change', e => {
      updateInventory(e.target.dataset.art, e.target.dataset.field, e.target.value);
      flashRow(e.target);
      // Status may change — re-render after a brief delay
      setTimeout(() => render(), 350);
    });
    inp.addEventListener('click', e => e.stopPropagation());
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === 'Escape') e.target.blur(); });
  });
  // Special checkbox
  document.querySelectorAll('.special-input').forEach(inp => {
    inp.addEventListener('change', e => {
      updateInventory(e.target.dataset.art, 'special', e.target.checked);
      flashRow(e.target);
      setTimeout(() => render(), 350);
    });
  });
}

function flashRow(el) {
  const tr = el.closest('tr');
  if (!tr) return;
  tr.classList.add('saved-flash');
  setTimeout(() => tr.classList.remove('saved-flash'), 600);
}

function updateRowClasses(el) {
  const tr = el.closest('tr');
  if (!tr) return;
  const art = tr.dataset.art;
  const alt = STATE.alternatives[art];
  if (alt && (alt.altPartNumber || alt.altName || alt.supplier)) tr.classList.add('has-alt');
  else tr.classList.remove('has-alt');
}

function renderProfiles() {
  const agg = {};
  for (const el of STATE.elements) {
    for (const p of el.parts) {
      const info = (p.catalogName)
        ? { cat: p.category, type: p.type, name: p.catalogName }
        : lookupArticle(p.artNr, p.description);
      if (info.cat !== 'profile') continue;
      if (!agg[p.artNr]) agg[p.artNr] = { artNr: p.artNr, name: info.name, type: info.type, cuts: [], totalLen: 0, totalQty: 0 };
      if (p.maat > 0) {
        agg[p.artNr].cuts.push({ length: p.maat, qty: p.stuks * el.qty, element: el.merknummer });
        agg[p.artNr].totalLen += p.maat * p.stuks * el.qty;
      }
      agg[p.artNr].totalQty += p.stuks * el.qty;
    }
  }
  const rows = Object.values(agg).sort((a, b) => b.totalLen - a.totalLen);

  return `
    <div style="margin-bottom:16px;color:var(--ink-3);font-size:13px">
      ${rows.length} profile types · ${(rows.reduce((s, r) => s + r.totalLen, 0) / 1000).toFixed(2)} m total
    </div>
    ${rows.map(r => `
      <div class="detail-pane" style="margin-bottom:14px">
        <div class="detail-pane-head">
          <h3>${r.name} · <span class="tag tag-accent">${r.artNr}</span></h3>
          <span class="tag">${(r.totalLen / 1000).toFixed(2)} m · ${r.totalQty} pcs</span>
        </div>
        <div class="detail-pane-body" style="padding:0">
          <div class="table-wrap" style="border:none;border-radius:0">
            <table>
              <thead><tr><th>ELEMENT</th><th class="num">LENGTH</th><th class="num">QTY</th><th class="num">SUBTOTAL</th></tr></thead>
              <tbody>
                ${r.cuts.map(c => `

                    <td class="mono">${c.element}</td>
                    <td class="num">${c.length.toFixed(1)} mm</td>
                    <td class="num">${c.qty}</td>

function renderHardware() {

        ? { cat: p.category, type: p.type, name: p.catalogName }

      if (info.cat !== 'hardware') continue;
      if (!agg[p.artNr]) agg[p.artNr] = { artNr: p.artNr, name: info.name, type: info.type, totalQty: 0, elements: new Set() };

/* ---------------- PURCHASE ORDERS ---------------- */

// Group items to be ordered by supplier name. Returns { supplierName: [items] }
function groupOrderItemsBySupplier() {
  const groups = {};
  // Need a flat list of unique articles with required totals
  const agg = {};
  for (const el of STATE.elements) {
    for (const p of el.parts) {
      if (!agg[p.artNr]) {
        const info = p.catalogName
          ? { name: p.catalogName, cat: p.category }
          : lookupArticle(p.artNr, p.description);
        agg[p.artNr] = {
          artNr: p.artNr, description: p.description, totalQty: 0, totalLength: 0,
          category: info.name, cat: info.cat, usedIn: new Set(),
        };
      }
      agg[p.artNr].totalQty += p.stuks * el.qty;
      if (p.maat) agg[p.artNr].totalLength += p.maat * p.stuks * el.qty;
      agg[p.artNr].usedIn.add(el.merknummer);
    }
  }
  for (const r of Object.values(agg)) {
    const inv = STATE.inventory[r.artNr] || {};
    const toOrder = Number(inv.toOrder || 0);
    if (toOrder <= 0) continue;
    const alt = STATE.alternatives[r.artNr] || {};
    const supplier = (alt.supplier || '').trim() || '— unassigned —';
    if (!groups[supplier]) groups[supplier] = [];
    groups[supplier].push({
      artNr: r.artNr,
      description: r.description,
      category: r.category,
      cat: r.cat,
      totalQty: r.totalQty,
      totalLength: r.totalLength,
      usedIn: [...r.usedIn],
      toOrder,
      inStock: Number(inv.inStock || 0),
      onOrder: Number(inv.onOrder || 0),
      leadTime: inv.leadTime || '',
      special: !!inv.special,
      altPartNumber: alt.altPartNumber || '',
      altName: alt.altName || '',
      notes: alt.notes || '',
    });
  }
  // Sort items within each supplier by category then artNr
  for (const k of Object.keys(groups)) {
    groups[k].sort((a, b) => (a.cat || '').localeCompare(b.cat || '') || a.artNr.localeCompare(b.artNr));
  }
  return groups;
}

function getOrInitPOMeta(supplierName) {
  if (!STATE.poMeta[supplierName]) STATE.poMeta[supplierName] = {};
  return STATE.poMeta[supplierName];
}

function ensurePOTemplate() {
  if (!STATE.poTemplate) STATE.poTemplate = { ...DEFAULT_PO_TEMPLATE };
  return STATE.poTemplate;
}

function suggestPONumber(supplierName) {
  const tpl = ensurePOTemplate();
  // Find the next unused integer based on existing meta + start value
  const used = new Set();
  for (const m of Object.values(STATE.poMeta)) {
    if (m && m.poNumber) {
      const num = String(m.poNumber).match(/(\d+)\s*$/);
      if (num) used.add(parseInt(num[1]));
    }
  }
  let n = Math.max(tpl.poNumberStart || 1, 1);
  while (used.has(n)) n++;
  return (tpl.poNumberPrefix || '') + String(n).padStart(4, '0');
}

function attachPOHandlers() {
  // Template inputs — auto-save as user types (debounced)
  let saveTimer = null;
  const debouncedSave = () => {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => saveState(), 350);
  };
  document.querySelectorAll('.po-tpl-input').forEach(inp => {
    inp.addEventListener('input', e => {
      const tpl = ensurePOTemplate();
      const f = e.target.dataset.field;
      const v = e.target.type === 'number' ? Number(e.target.value || 0) : e.target.value;
      tpl[f] = v;
      debouncedSave();
    });
  });
  // Per-PO meta inputs
  document.querySelectorAll('.po-meta-input').forEach(inp => {
    inp.addEventListener('input', e => {
      const supplier = e.target.dataset.supplier;
      const f = e.target.dataset.field;
      const meta = getOrInitPOMeta(supplier);
      meta[f] = e.target.value;
      debouncedSave();
    });
  });
  // Action buttons
  document.querySelectorAll('[data-action="preview-po"]').forEach(btn => {
    btn.addEventListener('click', e => openPOPreview(e.currentTarget.dataset.supplier, false));
  });
  document.querySelectorAll('[data-action="print-po"]').forEach(btn => {
    btn.addEventListener('click', e => openPOPreview(e.currentTarget.dataset.supplier, true));
  });
}

// Open the printable PO in a dedicated overlay. If `andPrint` is true, immediately
// invoke print after a tiny delay so the user just hits "Save as PDF" in the dialog.
function openPOPreview(supplierName, andPrint) {
  const tpl = ensurePOTemplate();
  if (!tpl.companyName || !tpl.companyAddress) {
    toast('Fill in company name and address first', 'error');
    return;
  }
  const groups = groupOrderItemsBySupplier();
  const items = groups[supplierName];
  if (!items || items.length === 0) {
    toast('No items to order for this supplier', 'error');
    return;
  }
  const meta = getOrInitPOMeta(supplierName);
  if (!meta.poNumber) meta.poNumber = suggestPONumber(supplierName);
  meta.printedAt = new Date().toISOString();
  saveState();
  // Build and inject the printable PO into a print-only container, then trigger print
  const html = buildPrintablePO(supplierName, items, meta, tpl);
  // Reuse a single hidden container
  let host = document.getElementById('po-print-host');
  if (!host) {
    host = document.createElement('div');
    host.id = 'po-print-host';
    document.body.appendChild(host);
  }
  host.innerHTML = html;
  document.body.classList.add('po-printing');
  if (andPrint) {
    // Brief defer so the browser lays out the new content before opening the dialog
    setTimeout(() => {
      window.print();
      // Cleanup happens via the onafterprint event below
    }, 80);
  } else {
    // Preview mode — show overlay, no auto-print
    host.classList.add('po-preview-mode');
    // Add a close button
    const close = document.createElement('button');
    close.className = 'btn po-preview-close';
    close.textContent = '✕ Close preview';
    close.onclick = () => closePOPreview();
    host.appendChild(close);
    // Also offer a print button
    const print = document.createElement('button');
    print.className = 'btn btn-primary po-preview-print';
    print.textContent = 'Print PDF';
    print.onclick = () => window.print();
    host.appendChild(print);
  }
}

function closePOPreview() {
  document.body.classList.remove('po-printing');
  const host = document.getElementById('po-print-host');
  if (host) {
    host.innerHTML = '';
    host.classList.remove('po-preview-mode');
  }
  render();
}

// Catch end-of-print and clean up
window.addEventListener('afterprint', () => {
  // Only auto-close in print-direct mode (no preview)
  const host = document.getElementById('po-print-host');
  if (host && !host.classList.contains('po-preview-mode')) {
    closePOPreview();
  }
});

          STATE.elements = data.elements;
          if (data.alternatives && typeof data.alternatives === 'object') {
            STATE.alternatives = data.alternatives;

          if (data.inventory && typeof data.inventory === 'object') {

/* ---------------- EXPORTS ---------------- */
function csvEscape(v) {
  if (v === null || v === undefined) return '';
  const s = String(v);
  if (s.includes(',') || s.includes('"') || s.includes('\n')) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function downloadFile(name, content, type = 'text/csv') {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportCsv(kind) {
  let rows = [];
  let name = '';
  // Build a reusable aggregation across all elements
  const aggregate = () => {
    const agg = {};
    for (const el of STATE.elements) {
      for (const p of el.parts) {
        if (!agg[p.artNr]) {
          const info = p.catalogName
            ? { name: p.catalogName, cat: p.category, source: p.catalogSource || 'catalog' }
            : lookupArticle(p.artNr, p.description);
          agg[p.artNr] = {
            artNr: p.artNr, description: p.description, totalQty: 0, totalLen: 0,
            category: info.name, cat: info.cat, classifySource: info.source || 'catalog',
            usedIn: new Set(),
          };
        }
        agg[p.artNr].totalQty += p.stuks * el.qty;
        if (p.maat) agg[p.artNr].totalLen += p.maat * p.stuks * el.qty;
        agg[p.artNr].usedIn.add(el.merknummer);
      }
    }
    return agg;
  };
  if (kind === 'bom') {
    name = 'BOM_aggregated.csv';
    const agg = aggregate();
    rows.push([
      'Article', 'Description', 'Category', 'Classified by',
      'Total Qty', 'Total Length (mm)', 'Total Length (m)', 'Used In',
      'Alt. Part Nr', 'Alt. Name', 'Supplier', 'Notes',
      'In Stock', 'Reorder At', 'On Order', 'To Order', 'Lead Time (days)', 'Special / Made in-house'
    ]);
    for (const r of Object.values(agg)) {
      const alt = STATE.alternatives[r.artNr] || {};
      const inv = (STATE.inventory && STATE.inventory[r.artNr]) || {};
      rows.push([
        r.artNr, r.description, r.category, r.classifySource,
        r.totalQty, r.totalLen.toFixed(1), (r.totalLen / 1000).toFixed(3),
        [...r.usedIn].join(' | '),
        alt.altPartNumber || '', alt.altName || '', alt.supplier || '', alt.notes || '',
        inv.inStock || '', inv.reorderAt || '', inv.onOrder || '', inv.toOrder || '', inv.leadTime || '',
        inv.special ? 'YES' : ''
      ]);
    }
  } else if (kind === 'purchase') {
    name = 'Purchase_order.csv';
    const agg = aggregate();
    rows.push(['Article', 'Description', 'Category', 'Total Required', 'In Stock', 'On Order', 'To Order', 'Alt. Part Nr', 'Alt. Name', 'Supplier', 'Lead Time (days)', 'Notes']);
    const items = Object.values(agg).map(r => {
      const alt = STATE.alternatives[r.artNr] || {};
      const inv = (STATE.inventory && STATE.inventory[r.artNr]) || {};
      return { r, alt, inv, toOrder: Number(inv.toOrder || 0) };
    }).filter(x => x.toOrder > 0)
      .sort((a, b) => (a.alt.supplier || 'zzz').localeCompare(b.alt.supplier || 'zzz'));
    for (const { r, alt, inv } of items) {
      rows.push([
        r.artNr, r.description, r.category, r.totalQty,
        inv.inStock || 0, inv.onOrder || 0, inv.toOrder || 0,
        alt.altPartNumber || '', alt.altName || '', alt.supplier || '', inv.leadTime || '', alt.notes || ''
      ]);
    }
  } else if (kind === 'special') {
    name = 'Special_parts.csv';
    const agg = aggregate();
    rows.push(['Article', 'Description', 'Category', 'Total Required', 'Used In', 'Notes', 'Production Notes']);
    const items = Object.values(agg).map(r => {
      const inv = (STATE.inventory && STATE.inventory[r.artNr]) || {};
      const alt = STATE.alternatives[r.artNr] || {};
      return { r, inv, alt, special: !!inv.special, unclassified: r.classifySource === 'fallback' };
    }).filter(x => x.special || x.unclassified);
    for (const { r, inv, alt } of items) {
      rows.push([
        r.artNr, r.description, r.category, r.totalQty,
        [...r.usedIn].join(' | '),
        alt.notes || '', inv.productionNotes || ''
      ]);
    }
  } else if (kind === 'alternatives') {
    name = 'Alternatives.csv';
    rows.push(['Original Article', 'Original Description', 'Original Category', 'Alt. Part Nr', 'Alt. Name', 'Supplier', 'Notes']);
    const origInfo = {};
    for (const el of STATE.elements) for (const p of el.parts) {
      if (!origInfo[p.artNr]) origInfo[p.artNr] = { description: p.description, name: p.catalogName || lookupArticle(p.artNr, p.description).name };
    }
    for (const [artNr, alt] of Object.entries(STATE.alternatives)) {
      if (!alt || !(alt.altPartNumber || alt.altName || alt.supplier || alt.notes)) continue;
      const o = origInfo[artNr] || { description: '', name: '' };
      rows.push([artNr, o.description, o.name, alt.altPartNumber || '', alt.altName || '', alt.supplier || '', alt.notes || '']);
    }
  } else if (kind === 'elements') {
    name = 'Elements_schedule.csv';
    rows.push(['Mark', 'Width (mm)', 'Height (mm)', 'Config', 'Qty', 'Weight Total (kg)', 'Weight Profiles (kg)', 'Weight Accessories (kg)', 'Uw', 'Uf', 'GWP (kg CO2e)', 'Process h', 'Mount h', 'Finish In', 'Finish Out']);
    for (const e of STATE.elements) {
      rows.push([e.merknummer, e.totalWidth, e.totalHeight, e.config, e.qty, e.weightTotal, e.weightProfiles, e.weightAccessories, e.uTotal, e.uProfile, e.gwp, e.processTime, e.mountTime, e.finishIn, e.finishOut]);
    }
  } else if (kind === 'cuts') {
    name = 'Cut_list.csv';
    rows.push(['Article', 'Description', 'Length (mm)', 'Qty', 'Element', 'Cut (mitre)', 'Alt. Part Nr', 'Supplier']);
    for (const e of STATE.elements) {
      for (const p of e.parts) {
        const cat = p.category || lookupArticle(p.artNr, p.description).cat;
        if (p.maat && cat === 'profile') {
          const alt = STATE.alternatives[p.artNr] || {};
          rows.push([p.artNr, p.description, p.maat.toFixed(1), p.stuks * e.qty, e.merknummer, p.cut || '', alt.altPartNumber || '', alt.supplier || '']);
        }
      }
    }
    rows.sort((a, b) => String(a[0]).localeCompare(String(b[0])) || (b[2] - a[2]));
  }
  const csv = rows.map(r => r.map(csvEscape).join(',')).join('\n');
  downloadFile(name, csv);
  toast(`Exported ${name}`, 'success');
}

function exportJson() {
  const data = {
    exported: new Date().toISOString(),
    project: 'La Gravière Construct Blok G',
    elements: STATE.elements,
    alternatives: STATE.alternatives,
    inventory: STATE.inventory,
  };
  downloadFile('BOMStudio_backup.json', JSON.stringify(data, null, 2), 'application/json');
  toast('JSON backup exported', 'success');
}

function exportElementBom(id) {
  const el = STATE.elements.find(e => e.id === id);
  if (!el) return;
  const rows = [['Element', el.merknummer]];
  rows.push(['Dimensions', `${el.totalWidth} x ${el.totalHeight} mm`]);
  rows.push(['Config', el.config]);
  rows.push([]);
  rows.push(['#', 'Article', 'Description', 'Qty', 'Length (mm)', 'Cut', 'Alt. Part Nr', 'Alt. Name', 'Supplier', 'Special']);
  for (const p of el.parts) {
    const alt = STATE.alternatives[p.artNr] || {};
    const inv = (STATE.inventory && STATE.inventory[p.artNr]) || {};
    rows.push([p.volgnr, p.artNr, p.description, p.stuks, p.maat || '', p.cut || '', alt.altPartNumber || '', alt.altName || '', alt.supplier || '', inv.special ? 'YES' : '']);
  }
  const csv = rows.map(r => r.map(csvEscape).join(',')).join('\n');
  downloadFile(`${el.merknummer}_BOM.csv`, csv);
  toast(`Exported ${el.merknummer}`, 'success');
}

/* ---------------- FILE HANDLING ---------------- */
async function handleFiles(fileList) {
  const files = Array.from(fileList).filter(f => f.name.toLowerCase().endsWith('.pdf'));
  if (files.length === 0) {
    toast('No PDF files selected', 'error');
    return;
  }
  showLoader(`Parsing ${files.length} PDF${files.length > 1 ? 's' : ''}…`);
  let added = 0;
  for (const file of files) {
    try {
      const { text } = await parsePDF(file);
      const el = parseStuklijst(text, file.name);
      // Replace if same merknummer already exists
      const idx = STATE.elements.findIndex(e => e.merknummer === el.merknummer);
      if (idx >= 0) STATE.elements[idx] = el;
      else STATE.elements.push(el);
      added++;
    } catch (e) {
      console.error('Parse error', file.name, e);
      toast(`Failed: ${file.name} — ${e.message}`, 'error');
    }
  }
  await saveState();
  hideLoader();
  toast(`Imported ${added} element${added !== 1 ? 's' : ''}`, 'success');
  render();
}

function deleteElement(id) {
  if (!confirm('Delete this element?')) return;
  STATE.elements = STATE.elements.filter(e => e.id !== id);
  STATE.selectedElement = null;
  saveState();
  toast('Element removed', 'success');
  render();
}

async function resetAll() {
  const altCount = Object.keys(STATE.alternatives).length;
  const invCount = Object.keys(STATE.inventory).length;
  if (!confirm('Delete ALL elements and reset the project? This cannot be undone.')) return;
  STATE.elements = [];
  STATE.selectedElement = null;
  // Alternatives + inventory are valuable user-entered catalogs — ask before wiping.
  if (altCount > 0 || invCount > 0) {
    const msg = `Also delete saved catalog data?\n\n· ${altCount} alternative component${altCount === 1 ? '' : 's'}\n· ${invCount} inventory entr${invCount === 1 ? 'y' : 'ies'}\n\n(Cancel keeps them for future imports.)`;
    if (confirm(msg)) {
      STATE.alternatives = {};
      STATE.inventory = {};
    }
  }
  await saveState();
  toast('Project reset', 'success');
  render();
}

/* ---------------- UI HELPERS ---------------- */
function toast(msg, kind = 'success') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast ' + kind;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

function showLoader(msg) {
  let l = document.getElementById('loader');
  if (!l) {
    l = document.createElement('div');
    l.id = 'loader';
    l.className = 'loader-overlay';
    l.innerHTML = `<div class="loader-box"><div class="spinner"></div><div id="loader-msg" style="font-size:13px;color:var(--ink-2)"></div></div>`;
    document.body.appendChild(l);
  }
  document.getElementById('loader-msg').textContent = msg;
}
function hideLoader() {
  const l = document.getElementById('loader');
  if (l) l.remove();
}

/* ---------------- INIT ---------------- */
document.getElementById('nav').addEventListener('click', e => {
  const item = e.target.closest('.nav-item');
  if (item) { STATE.selectedElement = null; setView(item.dataset.view); }
});

document.getElementById('import-btn').addEventListener('click', () => document.getElementById('file-input').click());
document.getElementById('file-input').addEventListener('change', e => handleFiles(e.target.files));
document.getElementById('reset-btn').addEventListener('click', resetAll);
document.getElementById('search-input').addEventListener('input', e => {
  STATE.searchTerm = e.target.value;
  render();
});

// Theme toggle ----------------------------------------------------------------
function applyTheme(theme) {
  document.body.classList.toggle('theme-light', theme === 'light');
  document.getElementById('theme-icon-dark').style.display  = theme === 'light' ? 'none' : '';
  document.getElementById('theme-icon-light').style.display = theme === 'light' ? '' : 'none';
  try { localStorage.setItem('bom_studio_theme', theme); } catch (e) {}
}
document.getElementById('theme-btn').addEventListener('click', () => {
  const isLight = document.body.classList.contains('theme-light');
  applyTheme(isLight ? 'dark' : 'light');
});
// Apply persisted choice on startup. Default = light, as requested.
let savedTheme = 'light';
try { savedTheme = localStorage.getItem('bom_studio_theme') || 'light'; } catch (e) {}
applyTheme(savedTheme);

// Re-classify any parts that lack catalogName (e.g. from older bundled data
// or backups parsed before the heuristic classifier existed). Idempotent.
function refreshClassifications() {
  let touched = 0;
  for (const el of STATE.elements) {
    for (const p of el.parts) {
      if (p.catalogName) continue;
      const info = lookupArticle(p.artNr, p.description);
      p.category = info.cat;
      p.type = info.type;
      p.catalogName = info.name;
      p.catalogSource = info.source;
      touched++;
    }
  }
  return touched;
}

// Auto-load demo data: try to fetch the example PDFs from server if available
async function init() {
  await loadState();
  // If empty, try auto-loading the bundled samples (for first-time users)
  if (STATE.elements.length === 0) {
    try {
      const sampleData = window.__BUNDLED_DATA__;
      if (sampleData && sampleData.length) {
        STATE.elements = sampleData;
      }
    } catch (e) { /* no bundled data */ }
  }
  // Always run the classifier refresh — picks up any new heuristics
  // for older parsed parts without re-importing PDFs.
  const refreshed = refreshClassifications();
  if (refreshed > 0) await saveState();
  render();
}
init();
</script>
